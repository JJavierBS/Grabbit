    <script>

      const tl = gsap.timeline({ paused: true });
      // shot 3: the person starts left of the tab pile, the frame re-centres as the pile leaves

      // shot 4: move the person to the right third for the last lines
      tl.to("#v4w", { scale: 1.15, x: 140, duration: 0.6, ease: "power2.inOut" }, 105.45);
      // Zoom-through cut (product-launch-video skill, cut catalog): footage pushes in, blurs and blooms to
      // the light ground before an app screen. After one it arrives oversized and settles.
      // Both sides of a cut move in the same direction and meet at the same blur.
      const B = "--hf-color-grading-blur", E = "--hf-color-grading-exposure";
      const out = (v, at, to) => { // at = the cut
        tl.to(v + "w", { ...to, duration: 0.4, ease: "power3.in" }, at - 0.4);
        tl.to(v, { [B]: 0.5, [E]: 1.4, duration: 0.3, ease: "power2.in" }, at - 0.3);
      };
      const back = (v, at, from, to, exposure) => {
        tl.fromTo(v + "w", from, { ...to, duration: 0.5, ease: "expo.out" }, at);
        tl.to(v, { [B]: 0, [E]: exposure, duration: 0.4, ease: "expo.out" }, at);
      };
      out("#v3", 25.3, { scale: 2.2, x: -900, y: -70 }); // into the phone screen
      // shot 5: the person sits on the right third, the plates on the left
      back("#v5", 77.3, { scale: 1.3, x: 115 }, { scale: 1.12, x: 115 }, 0.16);
      out("#v5", 82.1, { scale: 1.6, x: 115 });
      back("#v4", 96.1, { scale: 1.15, x: 0 }, { scale: 1, x: 0 }, 0.28);
      window.__timelines["main"] = tl;
    </script>
