name: Bug
description: Something that worked, or should work, is broken.
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: demo
    attributes:
      label: Breaks the demo?
      placeholder: yes / no
