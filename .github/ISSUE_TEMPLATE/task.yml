name: Task
description: A unit of work for one person or agent, one PR.
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done, from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Each item becomes at least one test.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [backend, frontend, design, infra, pitch, docs]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Files to touch, related issues, contract changes, links. Keep it short.
