# Tests every PR; on main also builds the image and rolls it out to EC2 (README "Deploy").
name: deploy

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # OpenUI sends install telemetry from a postinstall script unless told not to.
  DO_NOT_TRACK: "1"
  OPENUI_TELEMETRY_DISABLED: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --frozen --quiet
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: make test lint

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Skipped until the repo owner sets the DEPLOY_* variables and secrets (README "Deploy").
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}
    env:
      TARGET: ${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy deploy files
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$TARGET" 'mkdir -p /opt/junction/deploy'
          scp -i ~/.ssh/deploy -o BatchMode=yes deploy/Caddyfile deploy/rollout.sh \
            "$TARGET:/opt/junction/deploy/"
      - name: Roll out
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        # The job token lets the server pull a private package; it expires with the job.
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy -o BatchMode=yes "$TARGET" \
            "trap 'docker logout ghcr.io >/dev/null' EXIT
             docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null
             bash /opt/junction/deploy/rollout.sh '$IMAGE'"
